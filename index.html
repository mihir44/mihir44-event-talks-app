<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechTalks 2026 - Event Schedule</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
    --bg-color: #0f172a;
    --card-bg: #1e293b;
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --accent-color: #38bdf8;
    --accent-hover: #0ea5e9;
    --border-color: #334155;
    --transition: all 0.3s ease;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: var(--bg-color);
    color: var(--text-primary);
    line-height: 1.6;
    padding-bottom: 4rem;
}

.container {
    max-width: 900px;
    margin: 0 auto;
    padding: 2rem 1rem;
}

header {
    text-align: center;
    margin-bottom: 3rem;
}

h1 {
    font-size: 2.5rem;
    font-weight: 800;
    margin-bottom: 0.5rem;
    background: linear-gradient(to right, #38bdf8, #818cf8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.event-meta {
    color: var(--text-secondary);
    font-size: 1.1rem;
}

/* Search Section */
.search-container {
    margin-bottom: 3rem;
    position: sticky;
    top: 1rem;
    z-index: 100;
}

.search-wrapper {
    background: var(--card-bg);
    padding: 1rem;
    border-radius: 1rem;
    border: 1px solid var(--border-color);
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    display: flex;
    gap: 1rem;
    align-items: center;
}

input#category-search {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text-primary);
    font-size: 1rem;
    outline: none;
}

input#category-search::placeholder {
    color: var(--text-secondary);
}

.search-icon {
    color: var(--text-secondary);
}

/* Schedule Timeline */
.timeline {
    position: relative;
    padding-left: 2rem;
}

.timeline::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 2px;
    background: var(--border-color);
}

.timeline-item {
    position: relative;
    margin-bottom: 2.5rem;
}

.timeline-item::after {
    content: '';
    position: absolute;
    left: -2.4rem;
    top: 0.5rem;
    width: 1rem;
    height: 1rem;
    border-radius: 50%;
    background: var(--bg-color);
    border: 2px solid var(--accent-color);
}

.time-slot {
    font-weight: 600;
    color: var(--accent-color);
    margin-bottom: 0.5rem;
    display: block;
    font-size: 0.9rem;
}

.talk-card {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 0.75rem;
    padding: 1.5rem;
    cursor: pointer;
    transition: var(--transition);
}

.talk-card:hover {
    transform: translateX(10px);
    border-color: var(--accent-color);
}

.talk-title {
    font-size: 1.25rem;
    font-weight: 700;
    margin-bottom: 0.5rem;
}

.speakers {
    font-size: 0.95rem;
    color: var(--text-secondary);
    margin-bottom: 1rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
}

.categories {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-bottom: 1rem;
}

.category-tag {
    background: rgba(56, 189, 248, 0.1);
    color: var(--accent-color);
    padding: 0.25rem 0.75rem;
    border-radius: 9999px;
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
}

.description {
    font-size: 0.95rem;
    color: var(--text-secondary);
    height: 0;
    overflow: hidden;
    transition: var(--transition);
    opacity: 0;
}

.talk-card.expanded .description {
    height: auto;
    margin-top: 1rem;
    padding-top: 1rem;
    border-top: 1px solid var(--border-color);
    opacity: 1;
}

/* Lunch Break */
.lunch-break {
    margin: 3rem 0;
    padding: 1rem;
    text-align: center;
    background: rgba(51, 65, 85, 0.5);
    border-radius: 0.5rem;
    border: 1px dashed var(--border-color);
    color: var(--text-secondary);
    font-style: italic;
    position: relative;
}

.lunch-break::before {
    content: '☕';
    display: block;
    font-size: 1.5rem;
    margin-bottom: 0.5rem;
}

.no-results {
    text-align: center;
    padding: 3rem;
    color: var(--text-secondary);
}

@media (max-width: 640px) {
    h1 { font-size: 2rem; }
    .timeline { padding-left: 1.5rem; }
    .timeline-item::after { left: -1.9rem; }
}

    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>TechTalks 2026</h1>
            <p class="event-meta">Wednesday, June 10 • 10:00 AM - 05:40 PM • Single Track</p>
        </header>

        <div class="search-container">
            <div class="search-wrapper">
                <span class="search-icon">🔍</span>
                <input type="text" id="category-search" placeholder="Search by category, title, or speaker...">
            </div>
        </div>

        <div id="schedule" class="timeline">
            <!-- Schedule items will be injected here -->
        </div>
    </div>

    <script>
        window.talksData = [
  {
    "id": 1,
    "startTime": "10:00 AM",
    "endTime": "11:00 AM",
    "title": "Scaling Distributed Systems with Go",
    "speakers": ["Alex Chen", "Sarah Miller"],
    "categories": ["Backend", "Go", "Cloud"],
    "description": "Explore patterns and practices for building resilient, high-throughput distributed systems using the Go programming language. This talk covers concurrency primitives, service discovery, and fault tolerance."
  },
  {
    "id": 2,
    "startTime": "11:10 AM",
    "endTime": "12:10 PM",
    "title": "Modern Frontend: Beyond Frameworks",
    "speakers": ["Jordan Smith"],
    "categories": ["Frontend", "Performance", "Web"],
    "description": "Deep dive into web standards, browser APIs, and performance optimization techniques that help you build faster websites regardless of the framework you use."
  },
  {
    "id": 3,
    "startTime": "12:20 PM",
    "endTime": "01:20 PM",
    "title": "Architecting for Security in the Modern Era",
    "speakers": ["Maria Rodriguez"],
    "categories": ["Security", "DevOps"],
    "description": "Learn how to integrate security into every stage of your development lifecycle. We'll discuss Zero Trust architecture, secret management, and automated security scanning."
  },
  {
    "id": 4,
    "startTime": "02:20 PM",
    "endTime": "03:20 PM",
    "title": "Pragmatic Machine Learning for Software Engineers",
    "speakers": ["David Kim"],
    "categories": ["AI", "Data", "Python"],
    "description": "You don't need a PhD to leverage AI. This talk shows how to integrate pre-trained models and building simple classification systems into your existing applications."
  },
  {
    "id": 5,
    "startTime": "03:30 PM",
    "endTime": "04:30 PM",
    "title": "The Future of Serverless Computing",
    "speakers": ["Emily Watson", "Chris Lee"],
    "categories": ["Cloud", "Serverless", "Infrastructure"],
    "description": "An overview of the evolving serverless landscape, focusing on Edge computing, cold-start optimizations, and the move towards stateful serverless functions."
  },
  {
    "id": 6,
    "startTime": "04:40 PM",
    "endTime": "05:40 PM",
    "title": "Building Accessible and Inclusive Interfaces",
    "speakers": ["Sam Taylor"],
    "categories": ["Accessibility", "UI", "UX"],
    "description": "Accessibility is not a feature; it's a fundamental requirement. Discover how to create digital experiences that work for everyone using ARIA roles, semantic HTML, and thoughtful design."
  }
]
;
        document.addEventListener('DOMContentLoaded', () => {
    const searchInput = document.getElementById('category-search');
    const scheduleContainer = document.getElementById('schedule');
    
    // In the final single-file version, 'talksData' will be globally available
    // For development, we'll use an empty array if not defined
    const talks = window.talksData || [];

    function renderSchedule(filter = '') {
        const query = filter.toLowerCase().trim();
        scheduleContainer.innerHTML = '';

        const filteredTalks = talks.filter(talk => 
            talk.categories.some(cat => cat.toLowerCase().includes(query)) ||
            talk.title.toLowerCase().includes(query) ||
            talk.speakers.some(speaker => speaker.toLowerCase().includes(query))
        );

        if (filteredTalks.length === 0) {
            scheduleContainer.innerHTML = '<div class="no-results">No talks found matching your search.</div>';
            return;
        }

        // Logic to insert Lunch Break
        // Lunch is after the 3rd talk (id: 3)
        filteredTalks.forEach((talk, index) => {
            const talkElement = document.createElement('div');
            talkElement.className = 'timeline-item';
            talkElement.innerHTML = `
                <span class="time-slot">${talk.startTime} - ${talk.endTime}</span>
                <div class="talk-card" onclick="this.classList.toggle('expanded')">
                    <h2 class="talk-title">${talk.title}</h2>
                    <div class="speakers">
                        <span>👤</span> ${talk.speakers.join(', ')}
                    </div>
                    <div class="categories">
                        ${talk.categories.map(cat => `<span class="category-tag">${cat}</span>`).join('')}
                    </div>
                    <div class="description">${talk.description}</div>
                </div>
            `;
            scheduleContainer.appendChild(talkElement);

            // If this was Talk 3 (or the closest thing to it in filtered view), add lunch
            // Note: In a filtered view, identifying "after talk 3" is tricky.
            // We'll stick to the actual IDs from the data.
            if (talk.id === 3) {
                const lunchElement = document.createElement('div');
                lunchElement.className = 'lunch-break';
                lunchElement.innerHTML = `
                    <span class="time-slot">01:20 PM - 02:20 PM</span>
                    <strong>Lunch Break</strong>
                `;
                scheduleContainer.appendChild(lunchElement);
            }
        });
    }

    searchInput.addEventListener('input', (e) => {
        renderSchedule(e.target.value);
    });

    // Initial render
    renderSchedule();
});

    </script>
</body>
</html>
